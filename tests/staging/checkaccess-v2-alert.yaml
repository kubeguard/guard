# Guard CheckAccess v2 error alert
# Monitors Guard CCP logs for CheckAccess v2 failures during rollout.
#
# Pattern follows: secure-transport/rotator/ci/monitors/
# Database: AKSccplogs (Guard table)
# Deploy as adx-mon AlertRule on underlay clusters.
apiVersion: adx-mon.azure.com/v1
kind: AlertRule
metadata:
  name: monitor-guard-checkaccess-v2-errors
  namespace: adx-mon
  annotations:
    adx-mon/monitor-source: "https://msazure.visualstudio.com/CloudNativeCompute/_git/aks-rp?path=/ccp/control-plane-core/charts/kube-control-plane/charts/kube-authwebhook/ci/monitors/checkaccess-v2-errors.yaml"
    adx-mon/sig: "SecOps"
spec:
  database: AKSccplogs
  interval: 5m
  autoMitigateAfter: 2h
  destination: "MDM://aks/ccpandmanagementplan"
  query: |
    let _from = _startTime - 30m;
    let _to = _endTime;
    let _errorThreshold = 10;
    Guard
    | where TIMESTAMP between (_from .. _to)
    | where RPTenant == _region
    | where log has "E0" or log has "F0"
    | where log has "CheckAccess v2" or log has "invalid expiry" or log has "401" or log has "PDP"
    | extend error_type = case(
        log has "CheckAccess v2" and (log has "failed" or log has "error"), "CheckAccess_v2_failure",
        log has "invalid expiry", "Token_expiry_invalid",
        log has "401", "PDP_auth_failure",
        log has "connection refused", "PDP_connection_refused",
        "Other")
    | where error_type != "Other"
    | extend cluster = extract("MANAGEDCLUSTERS/([^\"]+)", 1, resource_id)
    | summarize error_count = count() by RPTenant, UnderlayName, error_type, cluster
    | where error_count >= _errorThreshold
    | extend Severity = 3
    | extend TableRow = bag_pack(
        "UnderlayName", UnderlayName,
        "Cluster", cluster,
        "ErrorType", error_type,
        "ErrorCount", tostring(error_count)
    )
    | summarize Table = make_list(TableRow) by RPTenant, UnderlayName, Severity
    | extend Title = strcat("[Guard] CheckAccess v2 errors in ", UnderlayName, " over last 30m")
    | extend Summary = strcat(
        "<strong>Guard pods are reporting CheckAccess v2 errors. This may indicate token audience mismatch (401), OBO service issues, or PDP connectivity problems.</strong><hr/>"
        "<strong>Possible causes:</strong><br/>"
        "- PDP_auth_failure (401): OBO returning ARM-audience tokens instead of PDP-audience tokens<br/>"
        "- Token_expiry_invalid: OBO returning tokens with invalid ExpiresOn<br/>"
        "- CheckAccess_v2_failure: SDK call to PDP failed<br/>"
        "- PDP_connection_refused: Network issue to PDP endpoint<hr/>"
        "#table(Table)"
    )
    | extend CorrelationId = tolower(strcat(
        "guard/checkaccess-v2-errors/", RPTenant, "/", UnderlayName
    ))
    | extend TSG = "https://github.com/kubeguard/guard/blob/master/docs/rca-checkaccess-v2-outage-793110894.md"
    | extend Region = RPTenant
